name: ci
on:
  push:
    # win-docker is a temporary CI trigger branch for the docker-backend Windows
    # named-pipe transport work — remove once that work merges to main.
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly run: integration tests pin real upstream artifacts (the msb release,
  # container image tags) that can drift or disappear between pushes — a scheduled
  # run surfaces that breakage without waiting for the next commit.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Integration-test selection: Cargo has no test-tag mechanism, so this workspace
# uses a Cargo feature, `sandbox-it`, to gate the integration-test modules/
# `#[cfg(feature = "sandbox-it")]` items instead of `#[ignore]` + `--ignored`: a
# feature composes cleanly with `RIGHTSIZE_BACKEND` env selection and keeps
# `cargo test --workspace` (no features) runtime-free on any machine, which is
# the property the `unit` job below checks.
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - run: cargo build --workspace
      - run: cargo test --workspace

  msb-linux:
    runs-on: ubuntu-latest # GitHub-hosted runners expose /dev/kvm
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      # Image-cache warming is incremental: registries rate-limit the runners'
      # shared IPs, so each run restores the newest prior cache, pulls what the
      # quota allows, and saves its grown copy even on failure — after a few
      # runs the cache is warm and pulls stop entirely.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.microsandbox/cache
          key: msb-images-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: msb-images-v2-${{ runner.os }}-
      - run: RIGHTSIZE_BACKEND=microsandbox cargo test --workspace --features sandbox-it 2>&1 | tee /tmp/it-output.log
        shell: bash
      # A pull interrupted mid-write can leave the image cache's index pointing at
      # layer files that don't exist; msb then hard-errors on that image forever.
      # Purge before saving so a corrupted cache is never banked for future runs —
      # the next run re-pulls clean instead of restoring the poison.
      - name: Purge image cache if corruption was observed
        if: always()
        shell: bash
        run: |
          if grep -q "cache error at .*No such file" /tmp/it-output.log 2>/dev/null; then
            echo "image-cache corruption detected — purging before save"
            rm -rf ~/.microsandbox/cache
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.microsandbox/cache
          key: msb-images-v2-${{ runner.os }}-${{ github.run_id }}

  # msb-windows: native msb on Windows Hypervisor Platform (WHP). Confirmed working on
  # both windows-2022 and windows-2025 hosted runners by the windows-spike workflow
  # (see this repo's `windows-spike` branch and the family design doc's "Windows spike
  # findings" appendix): WHP is already Enabled with RestartNeeded=False on both images,
  # so no enablement step is needed here (unlike the spike, which probed for that).
  #
  # This is also the only lane that compiles the FULL workspace on Windows (the
  # `cargo check --workspace --all-targets` step below, run before anything else) —
  # no other job builds anything on `windows-msvc` at all, so this is what would have
  # caught `rightsize-docker` failing to compile there before it grew a named-pipe
  # transport (see docs/backends.md's "Hand-rolled transport, and why"). The actual
  # test invocations below stay scoped to `-p rightsize-msb`, `-p rightsize-docker`'s
  # own unit suite, and the shared contract suite, not `--workspace`, for reasons
  # unrelated to compilation:
  # - `rightsize` (core)'s own unit suite has two pre-existing, Windows-path-portability
  #   gaps unrelated to msb: `mountable_file::for_host_path_leaves_an_absolute_path_
  #   untouched` asserts a hardcoded POSIX path (`/etc/hosts`) round-trips unmodified
  #   through `PathBuf`, which Windows absolutizes to `D:/etc/hosts`; `wait::do_while_
  #   performs_at_least_one_probe_even_on_a_short_timeout` asserts a loopback
  #   connection-refused round-trip completes within a 2s slack budget, which Windows'
  #   TCP stack occasionally exceeds by ~20ms. Both are core path/timing-portability
  #   gaps in `rightsize`'s own test suite, not `rightsize-msb` regressions — out of
  #   scope for the msb Windows work, so this lane doesn't compile/run core's unit
  #   suite at all rather than fighting either gap here.
  # This lane verifies `rightsize-msb` (whose own `backend_it.rs`/
  # `network_links_it.rs` already exercise `rightsize` at the integration level),
  # `rightsize-docker`'s own unit suite (its named-pipe/`DOCKER_HOST` endpoint
  # selection and blocking-transport deadline-bounding, none of which needs a live
  # daemon this runner doesn't have), and the shared backend contract suite on real
  # WHP.
  msb-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      # The whole-workspace compile gate: catches a Windows compile break in ANY
      # crate (not just the ones the test steps below happen to touch) before any of
      # them run. `--all-targets` includes test/bench targets, so a `#[cfg(windows)]`
      # test that only exists on this platform is checked too, not just library code.
      - run: cargo check --workspace --all-targets
      # `rightsize-docker`'s own unit suite, no `sandbox-it` (that needs a live daemon
      # this runner doesn't have — see the `rightsize-modules` step's own note below).
      # This is what actually *runs* the `#[cfg(windows)]` unit tests the check step
      # above only compiles: `DockerClient::from_docker_host`'s named-pipe/`npipe://`
      # endpoint-selection cases, and `crate::stream::run_with_deadline`'s
      # bounded-wait behavior (the thing standing in for a real per-handle timeout on
      # a Windows named-pipe handle, which has no such knob of its own).
      - run: cargo test -p rightsize-docker --lib
      # Same incremental image-cache warming as msb-linux, Windows-suffixed keys and
      # msb's Windows-native cache path (see install.ps1's own default install root;
      # this crate's Windows cache root is %LOCALAPPDATA%\rightsize, but msb's own
      # pulled-image cache is still under %USERPROFILE%\.microsandbox\cache).
      - uses: actions/cache/restore@v4
        with:
          path: ~/.microsandbox/cache
          key: msb-images-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: msb-images-v2-${{ runner.os }}-
      # --test-threads=1, Windows-only: the msb-linux lane runs this same
      # backend_it.rs concurrently (its 4 #[tokio::test]s booting real microVMs at
      # once) without issue, but on windows-2025 that concurrency hit a real msb-side
      # race — concurrent `msb run` invocations corrupted msb's own internal SQLite
      # state ("UNIQUE constraint failed: seaql_migrations.version"), not this crate's
      # code. Serializing this job's test execution avoids the race; it does not mask
      # a rightsize-msb bug, since the same assertions still run, just one at a time.
      - run: RIGHTSIZE_BACKEND=microsandbox cargo test -p rightsize-msb --features sandbox-it -- --test-threads=1 2>&1 | tee /tmp/it-output.log
        shell: bash
      # The backend contract suite, which lives in rightsize-modules rather than
      # rightsize-msb and so was never covered on Windows: msb-linux runs `--workspace`,
      # this lane ran a single package. That gap hid a real Windows-only failure of every
      # start-time file mount — the contract suite's own copy-file and mount cases catch
      # it, and they only ran on Linux. Scoped to `--test contract` deliberately: the rest
      # of rightsize-modules boots the whole module catalog serially, which this lane
      # cannot afford, while the contract suite is alpine and python only.
      # `--no-default-features --features backend-msb,sandbox-it` because the default
      # features include backend-docker, and this runner has no Docker daemon (Desktop
      # or otherwise) — `rightsize-docker` itself compiles fine on Windows now (see
      # the whole-workspace `cargo check` step above), this is purely about not
      # depending on a daemon this lane doesn't run; the suite's docker references are
      # gated on that same feature. Appends to the same log the cache-corruption guard
      # greps.
      - run: RIGHTSIZE_BACKEND=microsandbox cargo test -p rightsize-modules --no-default-features --features backend-msb,sandbox-it --test contract -- --test-threads=1 2>&1 | tee -a /tmp/it-output.log
        shell: bash
      # Same guard as msb-linux: never bank a cache a run observed corrupted, so the
      # next run re-pulls clean instead of restoring the poisoned entry. `shell: bash`
      # above (and here) matters on Windows runners, whose default shell is pwsh.
      - name: Purge image cache if corruption was observed
        if: always()
        shell: bash
        run: |
          if grep -q "cache error at .*No such file" /tmp/it-output.log 2>/dev/null; then
            echo "image-cache corruption detected — purging before save"
            rm -rf ~/.microsandbox/cache
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.microsandbox/cache
          key: msb-images-v2-${{ runner.os }}-${{ github.run_id }}

  # No msb-macos job: GitHub's hosted Apple Silicon runners are themselves VMs
  # without nested virtualization, so Hypervisor.framework VM creation fails
  # (msb: build_microvm VmSetup(VmCreate)). macOS support is verified on real
  # Apple Silicon hardware; a self-hosted mac runner could restore CI coverage.
  docker-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      # Image cache: warm loads beat re-pulls and keep registry rate limits out of
      # the picture entirely.
      # Cache key = hash of the pinned image list file.
      - name: Restore docker image cache
        id: docker-image-cache
        uses: actions/cache@v4
        with:
          path: ~/docker-image-cache
          key: docker-images-${{ hashFiles('.github/docker-images.txt') }}
      - name: Load cached images
        if: steps.docker-image-cache.outputs.cache-hit == 'true'
        run: for f in ~/docker-image-cache/*.tar; do docker load -i "$f"; done
      - run: RIGHTSIZE_BACKEND=docker cargo test --workspace --features sandbox-it
      - name: Save images to cache (first run only)
        if: steps.docker-image-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/docker-image-cache
          while read -r img; do
            [ -z "$img" ] && continue
            docker pull "$img" >/dev/null 2>&1 || true
            docker save "$img" -o ~/docker-image-cache/"$(echo "$img" | tr '/:' '__')".tar || true
          done < .github/docker-images.txt

  fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Floor is core-only, unit tests only — integration tests need a runtime
      # and don't run in this job. 80% line coverage is the floor.
      - name: cargo llvm-cov (core, line floor 80%)
        run: |
          cargo llvm-cov --package rightsize --lib --fail-under-lines 80 \
            --lcov --output-path target/llvm-cov.lcov
          # Same profdata, second report format (--html and --lcov are mutually
          # exclusive in one invocation on current cargo-llvm-cov).
          cargo llvm-cov report --html --output-dir target/llvm-cov-html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            target/llvm-cov-html
            target/llvm-cov.lcov
