# Publishes the four crates to crates.io, in dependency order. Manual trigger
# only. Unlike the Central Portal there is no staging step: each `cargo publish`
# is immediately live and permanent (yank-only). `cargo publish` itself blocks
# until the just-published crate is available in the index, so the sequential
# steps below cannot race the registry. Nothing publishes until the macOS gate
# (macos.yml) passes. See .github/RELEASING.md.
name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build, unit tests and a real provisioning of the pinned msb on Apple Silicon; see
  # macos.yml for what it checks and why it boots no sandbox.
  macos:
    uses: ./.github/workflows/macos.yml
    permissions:
      contents: read

  publish-to-crates-io:
    needs: macos
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - run: cargo publish -p rightsize
      - run: cargo publish -p rightsize-msb
      - run: cargo publish -p rightsize-docker
      - run: cargo publish -p rightsize-modules
